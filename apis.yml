name: Plate Iq
description: >-
  Plate IQ (now operating as Ottimate) is an AI-powered accounts payable (AP)
  automation platform for restaurants, hospitality groups, and multi-location
  finance teams. It captures and codes vendor invoices with line-item accuracy,
  matches purchase orders, routes approvals, detects fraud and overpayments, and
  processes vendor payments, syncing bi-directionally with accounting and ERP
  systems such as QuickBooks, NetSuite, Sage Intacct, Acumatica, and Microsoft
  Dynamics. The company was surfaced as a Y Combinator portfolio company and
  added to the API Evangelist network. As of this enrichment pass, Ottimate does
  not publish a public developer API, REST reference, or developer portal — its
  integrations are pre-built, managed connectors rather than a self-service API.
